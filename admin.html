/* account page styles */
[hidden]{display:none!important}
@media (min-width:960px){.auth{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}}
.auth-lede{margin-top:20px;max-width:42ch;color:var(--muted);font-size:clamp(17px,1.5vw,20px);line-height:1.5}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:clamp(20px,3vw,36px)}
.pill[disabled]{opacity:0.6;cursor:progress}
.acct-meta{margin-top:16px;color:var(--muted)}
.acct-actions{margin-top:24px;display:flex;flex-wrap:wrap;gap:12px}
.acct-actions .ghost{background:none;color:var(--foreground);font:inherit;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.14em;cursor:pointer}
.acct-grid{margin-top:clamp(40px,6vw,64px);display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media (min-width:960px){.acct-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.panel h2{font-size:22px;font-weight:600;line-height:1.2}
.panel .sub{margin-top:6px;font-size:15px;color:var(--muted)}
.items{margin-top:20px;list-style:none;border-top:1px solid var(--line)}
.items > li{padding-block:16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px}
.items .t{font-weight:600}
.items .s{grid-column:1/-1;font-size:14px;color:var(--muted)}
.items .p{font-weight:600;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:6px 12px;border-radius:9999px;border:1px solid var(--line-strong);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.12em}
.chip::before{content:"";width:8px;height:8px;border-radius:9999px;background:var(--muted)}
.chip.live::before{background:#3fb96b}
.chip.wait::before{background:#e0a33a}
.chip.no::before{background:var(--accent)}
.empty{margin-top:20px;color:var(--muted)}
.empty .actions{margin-top:16px}
.skel{color:var(--muted)}
.prices{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:8px}
.prices div{padding:10px 12px;border:1px solid var(--line);border-radius:6px}
.prices b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.prices span{font-size:13px;color:var(--muted)}
.wide{grid-column:1/-1}
.jobs{margin-top:20px;list-style:none;display:flex;flex-direction:column;gap:12px}
.job{border:1px solid var(--line-strong);border-radius:10px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px}
.job.new{border-color:var(--accent)}
.job .t{font-weight:600}
.job .p{font-weight:600;font-variant-numeric:tabular-nums}
.job .s{grid-column:1/-1;font-size:14px;color:var(--muted)}
.job .s a{color:var(--foreground)}
.job .when{grid-column:1/-1;font-size:15px}
.job .row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.job button,.job .call{min-height:44px;padding:0 18px;border-radius:9999px;font:inherit;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;cursor:pointer;border:1px solid var(--line-strong);background:none;color:var(--foreground);display:inline-flex;align-items:center;text-decoration:none}
.job .yes{background:var(--accent);border-color:var(--accent);color:var(--background)}
.job button[disabled]{opacity:0.5;cursor:progress}
.job .err{grid-column:1/-1;color:var(--accent);font-size:14px}
.job .err:empty{display:none}
.tabs-mini{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.tabs-mini button{min-height:36px;padding:0 14px;border-radius:9999px;border:1px solid var(--line-strong);background:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
.tabs-mini button[aria-pressed=true]{background:var(--foreground);border-color:var(--foreground);color:var(--background)}

.adm-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.stats{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:12px}
.stats div{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--surface)}
.stats b{display:block;font-family:var(--font-display,Anton,Impact,sans-serif);font-weight:400;font-size:36px;line-height:1}
.stats span{font-size:13px;color:var(--muted)}
.tabs2{margin-top:32px;display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--line);padding-bottom:12px}
.tabs2 button{min-height:40px;padding:0 16px;border-radius:9999px;border:1px solid var(--line-strong);background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.tabs2 button[aria-selected=true]{background:var(--foreground);border-color:var(--foreground);color:var(--background)}
.tabs2 .n{margin-left:6px;display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:9999px;background:var(--accent);color:var(--background);font-size:12px}
.list{margin-top:20px;list-style:none;display:flex;flex-direction:column;gap:12px}
.it{border:1px solid var(--line-strong);border-radius:10px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;background:var(--surface)}
.it.hot{border-color:var(--accent)}
.it .t{font-weight:600}
.it .p{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.it .s{grid-column:1/-1;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.it .s a{color:var(--foreground)}
.it .row{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.it button,.it select,.it .lnk{min-height:42px;padding:0 16px;border-radius:9999px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--line-strong);background:none;color:var(--foreground);text-decoration:none;display:inline-flex;align-items:center}
.it select{padding-right:10px;background:var(--background)}
.it .yes{background:var(--accent);border-color:var(--accent);color:var(--background)}
.it button[disabled]{opacity:0.5;cursor:progress}
.it .err{grid-column:1/-1;color:var(--accent);font-size:14px}
.it .err:empty{display:none}
.ph{grid-column:1/-1;display:flex;gap:8px;overflow-x:auto}
.ph img{width:88px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em}
.tag::before{content:"";width:8px;height:8px;border-radius:9999px;background:var(--muted)}
.tag.new::before,.tag.pending::before{background:#e0a33a}.tag.confirmed::before,.tag.approved::before,.tag.completed::before{background:#3fb96b}.tag.declined::before,.tag.cancelled::before{background:var(--accent)}
.filter{margin-top:16px;width:100%;max-width:28rem;min-height:44px;padding:0 14px;border-radius:9999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--foreground);font:inherit;font-size:16px}
</style>

    <span class="nav-end"><button type="button" class="theme-btn" data-theme-toggle aria-pressed="false" aria-label="Switch to light mode" title="Light mode"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button><a href="/#packages" class="pill">Book a detail</a></span>

<main id="main" class="px">
  <div class="wrap" style="padding-block:clamp(32px,6vw,72px)">
    <p class="skel" id="aLoading">Loading…</p>
    <section id="aNo" hidden>
      <p class="eyebrow">Gleam team</p>

      <div class="adm-top">
        <div><p class="eyebrow" id="aRole">Gleam team</p><h1 id="aHello">Owner</h1><p class="acct-meta" id="aTeam"></p></div>
        <a class="pill" href="/account.html">My account</a>
      </div>

    </section>

<script type="module">
import { subscribeMember, getMemberState, api } from '/js/gleam-auth.js';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = v => typeof v === 'number' && v > 0 ? '$' + (Math.round(v * 100) % 100 ? v.toFixed(2) : Math.round(v)) : '';
const when = x => { const v = x && x._createdDate; const s = v && (v.$date || v); const t = s ? new Date(s) : null; return t && !isNaN(t) ? t.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : ''; };
const tel = p => { const d = String(p || '').replace(/\D/g, ''); return d.length >= 10 ? (d.length === 10 ? '+1' + d : '+' + d) : ''; };
const ROLE = { owner: 'Owner', 'co-owner': 'Co-owner' };
let D = null, tab = 'bookings', q = '', started = false;

function hit(o){ if (!q) return true; const w = q.toLowerCase().split(/\s+/).filter(Boolean); const h = JSON.stringify(o).toLowerCase(); return w.every(x => h.includes(x)); }
function paint(){
  const B = D.bookings, A = D.applications, L = D.listings;
  const pend = A.filter(a => !a.status || a.status === 'pending').length, nb = B.filter(b => !b.status || b.status === 'new').length;
  $('aStats').innerHTML = [[nb, 'New bookings'], [B.filter(b => b.status === 'confirmed').length, 'Confirmed'], [B.length, 'All bookings'], [pend, 'Applications to review'], [L.length, 'Live detailers']]
    .map(([n, l]) => '<div><b>' + n + '</b><span>' + l + '</span></div>').join('');
  document.querySelectorAll('[data-tab]').forEach(b => { const n = b.dataset.tab === 'bookings' ? nb : b.dataset.tab === 'apps' ? pend : 0;
    b.setAttribute('aria-selected', String(b.dataset.tab === tab)); b.innerHTML = b.textContent.replace(/\d+$/, '') + (n ? '<span class="n">' + n + '</span>' : ''); });
  let h = '';
  if (tab === 'bookings') {
    const list = B.filter(hit);
    h = list.length ? '<ul class="list">' + list.map(b => { const t = tel(b.phone), st = b.status || 'new';
      return '<li class="it' + (st === 'new' ? ' hot' : '') + '"><span class="t">' + esc(b.package) + (b.addons ? ' + ' + esc(b.addons) : '') + ' · ' + esc(b.detailerName) + '</span><span class="p">' + money(b.total || b.price) + '</span>' +
        '<span class="s"><span class="tag ' + esc(st) + '">' + esc(st) + '</span> · ' + esc(b.preferredTime || 'Flexible') + ' · sent ' + when(b) + '</span>' +
        '<span class="s">' + esc(b.customerName) + ' · ' + (t ? '<a href="tel:' + t + '">' + esc(b.phone) + '</a>' : esc(b.phone)) + (b.email ? ' · ' + esc(b.email) : '') + '</span>' +
        '<span class="s">' + (b.serviceType === 'shop' ? 'At ' + esc(b.shopName || 'the shop') : esc([b.address, b.zip].filter(Boolean).join(' '))) + (b.notes ? ' · “' + esc(b.notes) + '”' : '') + '</span>' +
        '<div class="row"><label class="s" style="grid-column:auto">Status </label><select data-bs="' + esc(b._id) + '" aria-label="Booking status">' + ['new','confirmed','declined','completed','cancelled'].map(s => '<option' + (s === st ? ' selected' : '') + '>' + s + '</option>').join('') + '</select></div><p class="err" role="alert"></p></li>'; }).join('') + '</ul>'
      : '<p class="empty">' + (q ? 'Nothing matches.' : 'No bookings yet.') + '</p>';
  } else if (tab === 'apps') {
    const list = A.filter(hit).sort((a, b) => ((a.status || 'pending') === 'pending' ? 0 : 1) - ((b.status || 'pending') === 'pending' ? 0 : 1));
    h = list.length ? '<ul class="list">' + list.map(a => { const st = a.status || 'pending', t = tel(a.phone);
      const prices = [['priceExterior','Exterior'],['priceInterior','Interior'],['priceFull','Full']].filter(([k]) => a[k] > 0).map(([k, n]) => n + ' ' + money(a[k])).join(' · ');
      const ph = Array.isArray(a.workPhotos) ? a.workPhotos.filter(u => /^https:\/\/static\.wixstatic\.com\//.test(u)) : [];
      return '<li class="it' + (st === 'pending' ? ' hot' : '') + '"><span class="t">' + esc(a.name) + '</span><span class="p"><span class="tag ' + esc(st) + '">' + esc(st) + '</span></span>' +
        '<span class="s">' + [a.serviceMobile ? 'Mobile, ' + esc(a.radiusMiles || 10) + ' mi from ' + esc(a.zip) : '', a.serviceShop ? 'Shop: ' + esc(a.shopName) + ', ' + esc([a.shopAddress, a.shopCity, a.shopState, a.shopZip].filter(Boolean).join(', ')) : ''].filter(Boolean).join(' · ') + '</span>' +
        '<span class="s">' + esc(prices) + (a.addonsSummary ? ' · Add-ons: ' + esc(a.addonsSummary) : '') + '</span>' +
        '<span class="s">' + esc(a.email) + ' · ' + (t ? '<a href="tel:' + t + '">' + esc(a.phone) + '</a>' : esc(a.phone)) + ' · applied ' + when(a) + '</span>' +
        (a.about ? '<span class="s">“' + esc(a.about) + '”</span>' : '') +
        (ph.length ? '<div class="ph">' + ph.map(u => '<a href="' + esc(u) + '" target="_blank" rel="noopener"><img src="' + esc(u) + '/v1/fill/w_176,h_176,q_70/p.webp" alt="Work photo from ' + esc(a.name) + '" loading="lazy"></a>').join('') + '</div>' : '') +
        (st === 'pending' ? '<div class="row"><button type="button" class="yes" data-ap="' + esc(a._id) + '">Approve and list</button><button type="button" data-dp="' + esc(a._id) + '">Decline</button></div>' : '') + '<p class="err" role="alert"></p></li>'; }).join('') + '</ul>'
      : '<p class="empty">' + (q ? 'Nothing matches.' : 'No applications yet.') + '</p>';
  } else {
    const list = L.filter(hit);
    h = list.length ? '<ul class="list">' + list.map(l => '<li class="it"><span class="t">' + esc(l.name) + (l.shopName ? ' @ ' + esc(l.shopName) : '') + '</span><span class="p">' + [['priceExterior','Ext'],['priceInterior','Int'],['priceFull','Full']].filter(([k]) => l[k] > 0).map(([k, n]) => n + ' ' + money(l[k])).join(' · ') + '</span>' +
      '<span class="s">' + [l.serviceShop && !l.serviceMobile ? 'Shop only' : l.serviceShop ? 'Mobile + shop' : 'Mobile', esc([l.city, l.state].filter(Boolean).join(', ')), l.shopAddress ? esc(l.shopAddress) : ''].filter(Boolean).join(' · ') + '</span>' +
      '<div class="row"><button type="button" data-ul="' + esc(l._id) + '">Take off Gleam</button></div><p class="err" role="alert"></p></li>').join('') + '</ul>'
      : '<p class="empty">' + (q ? 'Nothing matches.' : 'No live detailers.') + '</p>';
  }
  $('aBody').innerHTML = h;
}
async function load(){ D = await api('/api/admin'); 
  $('aHello').textContent = 'Hi, ' + ((D.name || '').split(' ')[0] || 'there');
  $('aRole').textContent = 'Gleam ' + (ROLE[D.role] || 'team');
  $('aTeam').textContent = D.team.map(t => (t.name || t.email) + ' (' + (ROLE[t.role] || t.role) + ')').join(' · ');
  paint(); }
async function act(btn, body, done){
  const li = btn.closest('.it'), err = li.querySelector('.err'); li.querySelectorAll('button,select').forEach(x => x.disabled = true); err.textContent = '';
  try { await api('/api/admin', { method: 'POST', body }); await load(); if (done) done(); }
  catch (e) { li.querySelectorAll('button,select').forEach(x => x.disabled = false); err.textContent = 'That didn’t go through. Refresh and try again.'; }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; paint(); return; }
  const a = e.target.closest('[data-ap]'); if (a) return act(a, { action: 'approve', id: a.dataset.ap });
  const d = e.target.closest('[data-dp]'); if (d) { if (confirm('Decline this application?')) act(d, { action: 'decline_application', id: d.dataset.dp }); return; }
  const u = e.target.closest('[data-ul]'); if (u) { if (confirm('Take this detailer off Gleam? Customers won’t see them anymore. You can approve their application again later.')) act(u, { action: 'unlist', id: u.dataset.ul }); }
});
document.addEventListener('change', e => { const s = e.target.closest('[data-bs]'); if (s) act(s, { action: 'booking_status', id: s.dataset.bs, status: s.value }); });
$('aFilter').addEventListener('input', e => { q = e.target.value.trim(); paint(); });
subscribeMember(async () => {
  const s = getMemberState(); if (s.loading || started) return; started = true;
  try { await load(); $('aLoading').hidden = true; $('aYes').hidden = false; }
  catch (e) { $('aLoading').hidden = true; $('aNo').hidden = false; }
});
</script>
